[package]
name = "liteexplorer"
version = "0.1.11"
description = "A cross-platform file explorer for local files, network shares, and cloud storage"
authors = ["Litepod Studio"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "liteexplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
base64 = "0.22"
libc = "0.2"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlite",
  "migrate",
  "macros",
] }
tauri-plugin-dialog = "2"
aws-sdk-s3 = { version = "1.146", default-features = false, features = [
  "rt-tokio",
  "rustls",
  "default-https-client",
  "http-1x",
] }
keyring = "4.2"
percent-encoding = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", features = ["zlib-rs"] }
trash = "5.2.9"
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
if-addrs = "0.15"
russh = { version = "0.63", features = ["des"] }
russh-sftp = "3"
suppaftp = { version = "12", features = ["deprecated", "tokio-rustls-aws-lc-rs"] }
sha2 = "0.11.0"
rustls-native-certs = "0.8.4"
tauri-plugin-drag = "2"
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
mail-parser = "0.11.9"
x509-parser = "0.16"
cfb = "0.10"
psd = "0.3"
apache-avro = "0.17"
parquet = { version = "56", default-features = false, features = [
  "snap",
  "brotli",
  "flate2",
  "flate2-zlib-rs",
  "lz4",
  "zstd",
  "base64",
] }
bytes = "1"
arrow = { version = "56", default-features = false, features = [
  "ipc",
  "ipc_compression",
  "prettyprint",
] }
bzip2 = "0.6.1"
liblzma = { version = "0.4.8", features = ["static"] }
ruzstd = "0.9.0"
encoding_rs = "0.8.41"
codepage = "0.1.3"
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "release-health",
  "reqwest",
  "rustls",
] }
tauri-plugin-sentry = "0.6"


[lints.clippy]
all = { level = "warn", priority = -1 }

# Optimize dependencies in dev builds too, so compression and crypto crates don't
# crawl at opt-level 0 (keeps `tauri dev` responsive while our own code stays fast to rebuild).
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2", "objc2-core-foundation"] }
objc2-core-foundation = "0.3"
core-foundation-sys = "0.8"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "std",
  "NSError",
  "NSFileCoordinator",
  "NSString",
  "NSURL",
  "block2",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WNet",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gdk-pixbuf = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
