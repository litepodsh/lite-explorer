name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: apps/desktop

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux (x86_64)
            runner: ubuntu-22.04
            rust-targets: ""
            args: ""
          - name: Windows (x86_64)
            runner: windows-latest
            rust-targets: ""
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install NASM for aws-lc
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ci-${{ matrix.runner }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile

      # Compile-only validation: --no-bundle skips installers, updater
      # artifacts and signing, so no TAURI_SIGNING_PRIVATE_KEY is needed.
      - name: Build app (no bundle)
        working-directory: ${{ env.APP_DIR }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bun run tauri build --no-bundle ${{ matrix.args }}
