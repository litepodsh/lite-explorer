name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older, still-running one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: apps/desktop

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-latest
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux (x86_64)
            runner: ubuntu-22.04
            rust-targets: ""
            args: ""
          - name: Windows (x86_64)
            runner: windows-latest
            rust-targets: ""
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # NASM builds the assembly of rav1d (AVIF decoding) on every x86_64 target, and aws-lc on
      # Windows. Linux gets it from apt above. The Apple Silicon target does not need it, but the
      # Intel one is cross-built on an Apple Silicon runner, so macOS always installs it.
      - name: Install NASM for aws-lc
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install NASM for rav1d
        if: runner.os == 'macOS'
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ci-${{ matrix.runner }}-${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile

      # Compile-only validation: --no-bundle skips installers, updater
      # artifacts and signing, so no TAURI_SIGNING_PRIVATE_KEY is needed.
      - name: Build app (no bundle)
        working-directory: ${{ env.APP_DIR }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
        run: bun run tauri build --no-bundle ${{ matrix.args }}

  test:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ci-test-${{ runner.os }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile

      - name: Tests TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: bun run test:ts

      - name: Tests Rust
        working-directory: ${{ env.APP_DIR }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: bunx oxlint src

      - name: Svelte check
        working-directory: ${{ env.APP_DIR }}
        run: bun run check

      - name: Clippy
        working-directory: ${{ env.APP_DIR }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ci-test-macos

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile

      - name: Tests TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: bun run test:ts

      - name: Tests Rust
        working-directory: ${{ env.APP_DIR }}
        run: cargo test --manifest-path src-tauri/Cargo.toml
