# Builds the desktop app on macOS, Linux and Windows and publishes the installers to a
# GitHub release:
#   macOS    universal .dmg (Apple Silicon and Intel)
#   Linux    .deb, .rpm and .AppImage (x86_64)
#   Windows  .exe setup (NSIS, x86_64), installed for the current user without admin rights
#
# Run it by pushing a tag (`git tag v0.2.0 && git push origin v0.2.0`), or from the Actions
# tab with a version. The tag's version is written into tauri.conf.json before building, so
# file names match the release.
#
# Each release also uploads latest.json and signed update packages. The app checks
# https://github.com/litepodsh/lite-explorer/releases/latest/download/latest.json, so drafts
# and pre-releases never reach users. Set the TAURI_SIGNING_PRIVATE_KEY secret first.
#
# macOS uses the self-signed identity in APPLE_CERTIFICATE (base64 .p12),
# APPLE_CERTIFICATE_PASSWORD. The signing identity is derived from that certificate.
# It is not notarized.
# Windows installers remain unsigned.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, like v0.2.0"
        required: true
        type: string
      draft:
        description: "Keep the release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  APP_DIR: apps/desktop

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.result }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi

      - name: Create or reuse the draft release
        id: release
        env:
          DRAFT: ${{ github.event_name == 'push' && 'false' || inputs.draft }}
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const draft = process.env.DRAFT === "true";
            const { owner, repo } = context.repo;
            // Drafts aren't returned by getReleaseByTag, so look through the list.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((release) => release.tag_name === tag);
            if (existing) return existing.id;
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Lite Explorer ${tag}`,
              draft,
              prerelease: tag.includes("-"),
              generate_release_notes: true,
            });
            return data.id;

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux (x86_64)
            runner: ubuntu-22.04
            rust-targets: ""
            args: --bundles deb,rpm,appimage
          - name: Windows (x86_64)
            runner: windows-latest
            rust-targets: ""
            args: --bundles nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install NASM for aws-lc
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.runner }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install --frozen-lockfile

      - name: Set the app version from the tag
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          VERSION="${TAG#v}" bun -e '
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(await Bun.file(path).text());
            config.version = process.env.VERSION;
            await Bun.write(path, JSON.stringify(config, null, 2) + "\n");
          '
          grep '"version"' src-tauri/tauri.conf.json

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          umask 077
          keychain="$RUNNER_TEMP/liteexplorer-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/liteexplorer-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/liteexplorer-signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-certificate -a -p "$keychain" > "$RUNNER_TEMP/liteexplorer-signing.pem"
          if [ "$(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/liteexplorer-signing.pem")" != 1 ]; then
            echo "::error::APPLE_CERTIFICATE must contain exactly one self-signed code-signing certificate and its private key. Export the identity from Keychain Access > My Certificates as .p12."
            exit 1
          fi
          signing_identity=$(openssl x509 -in "$RUNNER_TEMP/liteexplorer-signing.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/liteexplorer-signing.pem"
          if ! security find-identity -v -p codesigning "$keychain" | grep -Fq "$signing_identity"; then
            echo "::error::The imported certificate has no valid code-signing identity. Re-export it with its private key and check its expiry and Code Signing usage."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Anonymous crash reporting. Read by src-tauri/build.rs and baked into the binary.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Signs the update packages the in-app updater downloads. The public key is in
          # tauri.conf.json. The password secret can stay unset for a key without one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.APP_DIR }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_DIR/src-tauri/target/universal-apple-darwin/release/bundle/macos/liteexplorer.app"
          codesign -d -r- "$APP_DIR/src-tauri/target/universal-apple-darwin/release/bundle/macos/liteexplorer.app"

      - name: Remove macOS signing certificate
        if: always() && runner.os == 'macOS'
        timeout-minutes: 1
        run: |
          # The hosted runner is disposable; revoking admin trust can wait for a GUI prompt.
          echo "Removing temporary certificate files"
          rm -f "$RUNNER_TEMP/liteexplorer-signing.p12" "$RUNNER_TEMP/liteexplorer-signing.pem"
          if [ -f "$RUNNER_TEMP/liteexplorer-signing.keychain-db" ]; then
            echo "Deleting temporary signing keychain"
            security delete-keychain "$RUNNER_TEMP/liteexplorer-signing.keychain-db"
          fi
          echo "Signing cleanup complete"

  publish-release:
    name: Publish release
    needs: [create-release, build]
    if: github.event_name == 'push' || !inputs.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
